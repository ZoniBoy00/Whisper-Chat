[workspace]
resolver = "2"
members = ["e2ee-core", "server", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Joni Sumioinen"]

# Hardened release profile: optimized, LTO-linked, panic=abort and fully
# stripped of debug symbols. Keeps the production binary small and makes
# reverse engineering significantly harder.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
