# Whisper relay — nginx reverse proxy template (direct TLS, origin cert).
#
# Chosen over Cloudflare Tunnel so the client can pin the ORIGIN certificate
# (through a tunnel the client would see Cloudflare's edge cert instead, and
# the §9 pinning rule only holds with direct TLS).
#
# Install:
#   1. sudo apt install nginx certbot python3-certbot-nginx
#   2. Copy this file to /etc/nginx/sites-available/whisper-relay
#      (edit server_name and the upstream port if changed)
#   3. sudo ln -s /etc/nginx/sites-available/whisper-relay /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Issue a certificate:
#        sudo certbot --nginx -d relay.example.com
#      certbot rewrites this file with the managed cert paths and sets up
#      auto-renewal (systemd timer), including an HTTP->HTTPS redirect.
#   6. Configure the relay to trust this proxy:
#        /etc/whisper/relay.env  ->  WHISPER_TRUSTED_PROXIES=127.0.0.1
#
# Security notes:
#   - TLS 1.3 (1.2 kept as a fallback for older clients); HSTS is enforced.
#   - X-Forwarded-For is OVERWRITTEN ($remote_addr), never appended: the
#     relay only trusts this header from the configured proxy list, and a
#     direct attacker cannot spoof it past nginx.
#   - Client bodies are capped (avatars/media) and WebSocket reads never time
#     out, so long-lived chat connections stay up.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Edit these — set by `certbot --nginx` when the cert is issued.
    server_name relay.example.com;
    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — once set, the browser refuses plain HTTP for max-age seconds.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Avatars/media can be a few MiB; the default 1 MiB would reject them.
    client_max_body_size 100m;

    # Envelope + media uploads.
    location /media/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket endpoint — the heart of the relay. Upgrade headers are
    # mandatory, and the proxy must not time out an idle chat connection.
    location /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Liveness probe.
    location = /healthz {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
