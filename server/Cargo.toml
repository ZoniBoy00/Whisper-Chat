[package]
name = "whisper-relay"
version = "0.1.0"
edition = "2021"
description = "Whisper — zero-knowledge blind relay server for E2EE messaging"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
e2ee-core = { path = "../e2ee-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.23.1"
sha2 = "0.11.0"
vodozemac = "0.10.0"
