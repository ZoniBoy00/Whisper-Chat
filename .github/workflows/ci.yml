name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

# Explicit least-privilege token: checkout needs repository contents; the
# audit job additionally grants checks/issues write for its status check.
permissions:
  contents: read

# Fast pushes during active development queue a run per commit; cancel the
# in-flight one so the runner pool is not wasted on stale code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build desktop frontend
        working-directory: desktop
        run: |
          npm install
          npm run build
      - run: cargo test --workspace

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build desktop frontend
        working-directory: desktop
        run: |
          npm install
          npm run build
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check creates a check-run; grant it write access so the
    # status check is actually created (otherwise it falls back to stdout).
    # contents:read must stay, otherwise checkout in THIS job loses access.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check RustSec advisory database
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/run-smoke.sh

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get
      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: Flutter test
        working-directory: mobile
        run: flutter test
      - name: Cargo check (whisper_core)
        working-directory: mobile/rust
        run: cargo check
