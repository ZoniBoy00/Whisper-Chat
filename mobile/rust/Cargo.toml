[package]
name = "whisper_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

# Standalone crate — do not inherit the Whisper workspace root (which only
# contains the desktop/server crates).
[workspace]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Shared crypto core — the same audited E2EE stack the desktop client uses.
e2ee-core = { path = "../../e2ee-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
vodozemac = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
# WebSocket client with TLS. On Android there is no OS certificate store
# rustls-native-certs can read ("no native root CA certificates"), so the
# Mozilla root set is bundled instead (rustls-tls-webpki-roots) — this works
# on Android, iOS, desktop and web alike.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Exactly one rustls crypto provider (ring) — see desktop Cargo.toml note.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
futures-util = "0.3"
# Password-encrypted backups: Argon2id (KDF) + AES-256-GCM (AEAD) — the same
# scheme as the desktop client's backup.rs.
argon2 = "0.5"
aes-gcm = "0.11"
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
