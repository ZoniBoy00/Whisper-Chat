name: whisper_mobile
description: "Whisper — privacy-first E2EE messenger (mobile)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  whisper_core:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/whisper-logo.png

