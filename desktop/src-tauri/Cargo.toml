[package]
name = "whisper-desktop"
version = "0.1.0"
description = "Whisper — privacy-first end-to-end encrypted desktop chat"
authors = ["ZoniBoy00"]
edition = "2021"

[lib]
name = "whisper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = "0.24"
vodozemac = "0.10"
e2ee-core = { path = "../../e2ee-core" }
