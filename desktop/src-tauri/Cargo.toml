[package]
name = "whisper-desktop"
version = "0.1.0"
description = "Whisper — privacy-first end-to-end encrypted desktop chat"
authors = ["Joni Sumioinen"]
edition = "2021"

[lib]
name = "whisper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
e2ee-core = { path = "../../e2ee-core" }
