[package]
name = "whisper-desktop"
version = "0.1.0"
description = "Whisper — privacy-first end-to-end encrypted desktop chat"
authors = ["ZoniBoy00"]
edition = "2021"

[lib]
name = "whisper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "tracing-log"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
base64 = "0.23"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# WebSocket client with TLS: `rustls-tls-native-roots` enables `wss://`
# connections (the deployed relay terminates TLS behind nginx/Caddy) using
# the OS certificate store — pure Rust, no extra OpenSSL dependency.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# Rustls needs EXACTLY ONE crypto provider or it panics at runtime
# ("Could not automatically determine the process-level CryptoProvider").
# tokio-tungstenite does not activate one itself, and rustls's DEFAULT
# provider (aws-lc-rs) pulls in a slow CMake/C build — so switch to `ring`
# (self-contained, small) and explicitly drop the aws-lc-rs default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
vodozemac = "0.10"
sha2 = "0.11"
# Password-encrypted full backups: Argon2id (KDF) + AES-256-GCM (AEAD) over
# the whole backup package. `rand` supplies the per-backup salt + nonce.
argon2 = "0.6"
aes-gcm = "0.11"
rand = "0.10"
# SQLCipher at-rest encryption. The `bundled-sqlcipher-vendored-openssl`
# feature compiles SQLCipher (and its OpenSSL dependency) from source, so the
# local history database is encrypted with a key derived from the identity.
# The build needs NASM + Perl on PATH (installed via MSYS2: `pacman -S nasm
# perl`). `store.rs` detects the codec at runtime (`PRAGMA cipher_version`)
# and keys the database with the identity-derived key; on a plain `bundled`
# build the same code runs unencrypted.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
e2ee-core = { path = "../../e2ee-core" }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

# The vendored OpenSSL static lib ships without PDB files, so the MSVC linker
# emits a LNK4099 warning per object file on every debug build. Harmless (no
# debug info exists to load), but it floods the console — silence it.
[lints.rust]
linker_messages = "allow"
