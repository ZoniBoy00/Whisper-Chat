[package]
name = "whisper-desktop"
version = "0.1.0"
description = "Whisper — privacy-first end-to-end encrypted desktop chat"
authors = ["ZoniBoy00"]
edition = "2021"

[lib]
name = "whisper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = "0.30"
vodozemac = "0.10"
sha2 = "0.11"
# SQLCipher at-rest encryption (the `bundled-sqlcipher` /
# `bundled-sqlcipher-vendored-openssl` features) cannot build on a stock
# Windows-MSVC toolchain: SQLCipher needs OpenSSL, and the vendored OpenSSL
# build needs a native (non-Cygwin) Perl plus NASM, neither of which is
# guaranteed present. We ship the plain `bundled` SQLite build and detect the
# codec at runtime (`PRAGMA cipher_version`): when a future build enables the
# SQLCipher features, `store.rs` automatically keys the database with the
# identity-derived key; on a plain build the same code runs unencrypted.
rusqlite = { version = "0.40", features = ["bundled"] }
e2ee-core = { path = "../../e2ee-core" }
